services:
  db:
    image: postgres:16
    container_name: unichance_db
    environment:
      POSTGRES_USER: unichance
      POSTGRES_PASSWORD: unichance
      POSTGRES_DB: unichance
    ports:
      - "5432:5432"
    volumes:
      - unichance_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unichance -d unichance"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend-go/migrations:/migrations:ro
    environment:
      PGPASSWORD: unichance
    command: >
      sh -c '
      set -e;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/001_init.sql;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/002_profile_and_scores.sql;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/003_updated_at_and_search_vector.sql;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/004_sources_links_fetchlog.sql;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/005_smart_matching.sql;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/010_drop_shortlists.sql;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/011_search_vector_fix.sql;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/012_degree_level_enum.sql;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/013_languages.sql;
      psql "postgresql://unichance@db:5432/unichance?sslmode=disable" -v ON_ERROR_STOP=1 -f /migrations/014_indexes.sql;
      # Добавить сюда 015_llm_service_support.sql (см. ниже)
      echo "✅ migrations applied";
      '

  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: unichance_backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://unichance:unichance@db:5432/unichance?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      LLM_SERVICE_URL: http://llm_service:8000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: unichance
      DB_PASSWORD: unichance
      DB_NAME: unichance
      DB_SSLMODE: disable
    ports:
      - "8080:8080"

  llm_service:
    build:
      context: ./llm_service
      dockerfile: Dockerfile
    container_name: unichance_llm
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://unichance:unichance@db:5432/unichance?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENVIRONMENT: development
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: unichance_frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"

  parser_scheduler:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: unichance_parser
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://unichance:unichance@db:5432/unichance?sslmode=disable
      COLLEGE_SCORECARD_KEY: ${COLLEGE_SCORECARD_KEY}
    command: ["/usr/local/bin/import_scorecard", "--once"]

volumes:
  unichance_pg:
